<!DOCTYPE html> 
 <html> 
 <head> 
     <meta charset="UTF-8">
     <title>物联网智能监控</title> 
     <style> 
         body { 
             font-family: 'Segoe UI', Arial, sans-serif; 
             display: flex; 
             justify-content: center; 
             align-items: center; 
             height: 100vh; 
             margin: 0; 
             background: #f8f9fa; 
         } 
         .container { 
             background: white; 
             padding: 2.5rem; 
             border-radius: 16px; 
             box-shadow: 0 8px 30px rgba(0,0,0,0.12); 
             text-align: center; 
             min-width: 350px; 
         } 
         .temperature { 
             font-size: 4rem; 
             color: #2a6df4; 
             margin: 1rem 0; 
             display: flex; 
             justify-content: center; 
             align-items: baseline; 
         } 
         .unit { 
             font-size: 1.8rem; 
             color: #6c757d; 
             margin-left: 0.5rem; 
         } 
         .status-badge {
             display: inline-block;
             padding: 0.5rem 1.2rem;
             border-radius: 20px;
             font-weight: bold;
             margin-bottom: 1.5rem;
             font-size: 0.9rem;
             transition: all 0.3s ease;
         }
         .status-open { background: #e1f5fe; color: #0288d1; }
         .status-closed { background: #ffebee; color: #d32f2f; }
         
         .control-panel {
             margin-top: 2rem;
             display: flex;
             gap: 1rem;
             justify-content: center;
         }
         button {
             padding: 0.8rem 1.5rem;
             border: none;
             border-radius: 8px;
             cursor: pointer;
             font-weight: 600;
             transition: transform 0.1s, opacity 0.2s;
         }
         button:active { transform: scale(0.95); }
         .btn-open { background: #4caf50; color: white; }
         .btn-close { background: #f44336; color: white; }
         button:hover { opacity: 0.9; }

         /* AI 聊天样式 */
         .ai-section {
             margin-top: 2rem;
             padding-top: 1.5rem;
             border-top: 1px solid #eee; 
             text-align: left;
         }
         .ai-chat-box {
             background: #f1f3f4;
             padding: 1rem;
             border-radius: 8px;
             height: 120px;
             overflow-y: auto;
             font-size: 0.9rem;
             color: #555;
             margin-bottom: 1rem;
             white-space: pre-wrap;
         }
         .ai-input-group {
             display: flex;
             gap: 0.5rem;
         }
         .ai-input {
             flex: 1;
             padding: 0.6rem;
             border: 1px solid #ddd;
             border-radius: 6px;
             outline: none;
         }
         .btn-ai { background: #673ab7; color: white; padding: 0.6rem 1rem; }
     </style> 
 </head> 
 <body> 
     <div class="container"> 
         <h1 style="font-size: 1.5rem; color: #495057; margin-bottom: 0.5rem;">AI 智能物联网监控</h1> 
         
         <!-- 窗户状态显示 -->
         <div id="statusBadge" class="status-badge {{ 'status-closed' if window_status == 'closed' else 'status-open' }}">
             窗户状态: <span id="statusText">{{ '已关闭' if window_status == 'closed' else '已打开' }}</span>
         </div>

         <!-- 温度显示 -->
         <div class="temperature"> 
             <span id="tempValue">{{ temperature }}</span><span class="unit">°C</span> 
         </div> 
         
         <!-- 网页控制按钮 -->
         <div class="control-panel">
             <button class="btn-open" onclick="controlWindow('open')">远程开窗</button>
             <button class="btn-close" onclick="controlWindow('close')">远程关窗</button>
         </div>

         <!-- AI 助手模块 -->
         <div class="ai-section">
             <h3 style="font-size: 1rem; color: #673ab7; margin-bottom: 0.8rem;">✨ AI 数据分析助手</h3>
             <div class="ai-chat-box" id="aiResponse">问问 AI：当前的温度适合开窗吗？</div>
             <div class="ai-input-group">
                 <input type="text" id="aiQuery" class="ai-input" placeholder="输入问题，如：分析数据或控制设备...">
                 <button class="btn-ai" onclick="askAI()">咨询 AI</button>
             </div>
         </div>

         <p style="color: #6c757d; font-size: 0.8rem; margin-top: 1.5rem;">数据实时同步中</p>
     </div> 

     <script>
         // 实时更新数据的函数
         function updateData() {
             fetch('/api/data')
                 .then(response => response.json())
                 .then(data => {
                     // 更新温度
                     document.getElementById('tempValue').innerText = data.temperature;
                     
                     // 更新窗户状态
                     const badge = document.getElementById('statusBadge');
                     const text = document.getElementById('statusText');
                     if (data.window_status === 'closed') {
                         badge.className = 'status-badge status-closed';
                         text.innerText = '已关闭';
                     } else {
                         badge.className = 'status-badge status-open';
                         text.innerText = '已打开';
                     }
                 })
                 .catch(err => console.error('数据同步失败:', err));
         }

         // 每 3 秒同步一次数据
         setInterval(updateData, 3000);

         function controlWindow(action) {
             fetch('/control/' + action)
                 .then(response => response.text())
                 .then(data => {
                     console.log('指令已发送:', action);
                     // 立即触发一次数据更新
                     setTimeout(updateData, 500);
                 });
         }

         function askAI() {
             const query = document.getElementById('aiQuery').value;
             if (!query) return;
             
             const responseBox = document.getElementById('aiResponse');
             responseBox.innerText = 'AI 正在思考中...';
             
             fetch('/ask_ai', {
                 method: 'POST',
                 headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify({ query: query })
             })
             .then(response => response.json())
             .then(data => {
                 responseBox.innerText = data.answer;
             })
             .catch(err => {
                 responseBox.innerText = '出错啦：' + err;
             });
         }
     </script>
 </body> 
 </html>
